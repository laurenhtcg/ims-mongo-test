services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  job-populate-default:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      # Resolved from your shell and from a ``.env`` file next to this compose file (see README).
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-mongo_bench}
      MONGO_BENCH_SKIP_SEARCH_INDEXES: ${MONGO_BENCH_SKIP_SEARCH_INDEXES:-1}
    depends_on:
      mongo:
        condition: service_healthy
    command: ["populate", "merge_all"]

  job-bench-search-basic:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-mongo_bench}
      MONGO_BENCH_SKIP_SEARCH_INDEXES: ${MONGO_BENCH_SKIP_SEARCH_INDEXES:-1}
    depends_on:
      mongo:
        condition: service_healthy
    command: ["bench", "search_basic"]

volumes:
  mongo_data:
