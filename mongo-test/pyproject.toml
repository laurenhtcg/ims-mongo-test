[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-bench"
version = "0.1.0"
description = "MongoDB search benchmarking toolkit (scaffold)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.6",
    "python-dotenv>=1.0",
]

[project.scripts]
mongo-bench = "mongo_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mongo_bench = ["resources/*.json"]
